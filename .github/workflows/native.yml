name: Native revival validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v7
      - name: Fetch pinned Boost archive
        shell: pwsh
        run: ./scripts/fetch-boost.ps1
      - name: Build and test native core and workers
        shell: pwsh
        run: ./scripts/build.ps1 -BoostRoot ./.deps/boost-1.92.0 -Configuration ${{ matrix.configuration }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-x64-${{ matrix.configuration }}
          path: |
            .build/x64/Testing/Temporary/*.log
            .build/x64/process-results-*.json
            .build/x64/${{ matrix.configuration }}/ipc_worker.exe
            .build/x64/${{ matrix.configuration }}/ipc_calc.exe
